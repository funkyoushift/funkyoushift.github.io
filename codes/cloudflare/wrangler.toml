name = "funkyoushift-bl3-codes"
main = "worker.js"
compatibility_date = "2026-08-24"
workers_dev = true

# GitHub Pages cannot POST. This Worker owns only the collector paths.
[[routes]]
pattern = "www.funkyoushift.com/codes/api/*"
zone_name = "funkyoushift.com"

[vars]
GITHUB_OWNER = "funkyoushift"
GITHUB_REPO = "funkyoushift.github.io"
SUBMISSIONS_PATH = "codes/data/submissions.json"
COMMUNITY_PATH = "codes/data/community.json"
# Set secrets (not in this file):
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put REVIEW_KEY
