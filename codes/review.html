<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review queue · FunkYouBoostingTools</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .serial { font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
    .notice {
      border: 1px solid var(--gold);
      background: #2a1f10;
      padding: 10px 12px;
      border-radius: 8px;
      margin: 12px 0;
    }
    .notice.bad {
      border-color: var(--bad);
      background: #2a1212;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin: 12px 0;
    }
    .toolbar label { margin: 0; min-width: 220px; }
    .file-btn {
      position: relative;
      overflow: hidden;
      display: inline-block;
      background: #1a140c;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--ink);
      cursor: pointer;
    }
    .file-btn:hover { border-color: var(--gold); color: var(--gold); }
    .file-btn input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand-block">
      <img class="brand-mark" src="logo.webp" alt="" width="40" height="40" onerror="this.style.display='none'" />
      <div>
        <div class="brand">FunkYouBoostingTools</div>
        <p class="sub">Review queue · pending → data/community.json on funkyoushift.com</p>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-link" href="./">Back to browser</a>
    </nav>
  </header>
  <main>
    <section class="panel">
      <h1>Pending submissions</h1>
      <p class="meta" id="meta">Checking the collector…</p>
      <div id="notice" class="notice" hidden></div>
      <div class="toolbar">
        <label>Review key
          <input id="reviewKey" type="password" autocomplete="off" placeholder="needed for the live queue" />
        </label>
        <button type="button" class="primary" id="loadLive">Load live queue</button>
        <button type="button" id="loadSite">Load site JSON</button>
        <label class="file-btn">Open downloaded JSON
          <input id="localFile" type="file" accept="application/json,.json" />
        </label>
        <button type="button" id="downloadStore" hidden>Download reviewed JSON</button>
      </div>
      <div id="box" class="hint">Loading…</div>
    </section>
  </main>
  <script src="config.js?v=3"></script>
  <script src="review-page.js?v=3"></script>
</body>
</html>
