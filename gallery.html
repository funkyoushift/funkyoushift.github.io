<body>

  <a href="index.html">Home</a>

<header class="hero">
  <h1>FUNKYOUSHIFT: BEHIND THE SCENES</h1>
</header>

<main>
  <section class="gallery-grid">
    <h2>📸 Click to View Full Image</h2>

    <!-- Thumbnails will be inserted here only if the image actually exists -->
    <div id="thumbs" class="thumbnail-grid" aria-live="polite"></div>

    <p id="no-images" style="display:none; color:#ccc; margin-top:1rem;">
      No images found yet. Add files to <code>/slideshow/</code> like <code>slide1.jpg</code>, <code>slide2.jpg</code>, etc.
    </p>
  </section>

  <section>
    <h2>🎥 Video Highlight</h2>
    <iframe width="100%" height="500" src="https://www.youtube.com/embed/Eo2fyS4E3NY"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>
  </section>
</main>

<footer class="social-links">
  <a href="https://www.twitch.tv/funkyoushift" target="_blank">Twitch</a>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span class="close-btn">X</span>
  <img id="lightbox-img" src="" alt="Full-size gallery image"/>
</div>

<script>
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }
  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  // Dynamically probe for existing images and only show ones that load.
  (function buildGallery() {
    const container = document.getElementById('thumbs');
    const noImages = document.getElementById('no-images');

    // Adjust range as needed. We'll try 1..60.
    const start = 1;
    const end = 60;

    let found = 0;

    for (let i = start; i <= end; i++) {
      const path = `slideshow/slide${i}.jpg`;

      const probe = new Image();
      probe.decoding = 'async';
      probe.loading = 'lazy';

      probe.onload = function () {
        const img = document.createElement('img');
        img.src = path;
        img.alt = `Gallery ${i}`;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onclick = () => openLightbox(path);
        container.appendChild(img);
        found++;
      };

      // If 404 or any load error, skip silently
      probe.onerror = function () { /* do nothing */ };

      // Kick off the request
      probe.src = path;
    }

    // If nothing loads after a short delay, show a hint
    setTimeout(() => {
      if (found === 0) {
        noImages.style.display = 'block';
      }
    }, 1200);
  })();
</script>
</body>
</html>
